# 마탑 강화기 안드로이드 앱(APK) 자동 빌드: mage-forge 폴더가 바뀌면 클라우드에서 APK를 만들어
# 'mage-forge' 릴리스에 올립니다. (건강 RPG의 'latest' 릴리스와는 따로 관리됩니다)
# 휴대폰에서 https://github.com/pshzzang71-ctrl/health-rpg/releases/download/mage-forge/mage-forge.apk 를 받아 설치하면 됩니다.
name: Mage Forge APK

on:
  push:
    branches: [main]
    paths:
      - "mage-forge/**"
      - ".github/workflows/mage-forge.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mage-forge-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"

      - name: Build APK
        working-directory: mage-forge/android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare file
        run: cp mage-forge/android/app/build/outputs/apk/debug/app-debug.apk mage-forge.apk

      - uses: actions/upload-artifact@v6
        with:
          name: mage-forge-apk
          path: mage-forge.apk

      - name: Publish to 'mage-forge' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mage-forge --yes --cleanup-tag || true
          gh release create mage-forge mage-forge.apk \
            --title "마탑 강화기 앱 (최신)" \
            --notes "휴대폰에서 아래 mage-forge.apk 를 눌러 내려받고 설치하세요. 기존 앱 위에 덮어 설치하면 기록이 유지됩니다. (빌드: ${GITHUB_SHA::7})" \
            --latest=false
