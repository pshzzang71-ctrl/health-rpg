# 안드로이드 앱(APK) 자동 빌드: android 폴더가 바뀌면 클라우드에서 APK를 만들어
# 'latest' 릴리스에 올립니다. 휴대폰에서 Releases > latest > health-rpg.apk 를 받아 설치하면 됩니다.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk health-rpg.apk

      - uses: actions/upload-artifact@v6
        with:
          name: health-rpg-apk
          path: health-rpg.apk

      - name: Publish to 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest health-rpg.apk \
            --title "건강 RPG 앱 (최신)" \
            --notes "휴대폰에서 아래 health-rpg.apk 를 눌러 내려받고 설치하세요. 기존 앱 위에 덮어 설치하면 기록이 유지됩니다. (빌드: ${GITHUB_SHA::7})" \
            --latest
