<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5cb8ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="매일 건강 목표를 달성하며 레벨업하는 오프라인 RPG">
<!-- GitHub(main) → Vercel 자동 배포 -->
<title>건강 RPG</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--cream:#fffaf0;--line:#f0dcb8;--wood:#e0ae6e;--wood2:#c48443;--tx:#4b3526;--sub:#94796a;--gold:#ffb703;--orange:#ff8a1f;--green:#3fbf55;--red:#ff5b5b;--jua:'Jua',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.45}
body{min-height:100vh;background:linear-gradient(180deg,#5cb8ff 0%,#a9ddff 42%,#e3f5ff 100%) fixed;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27560%27%20height%3D%27320%27%3E%3Cg%20fill%3D%27white%27%20opacity%3D%27.9%27%3E%3Ccircle%20cx%3D%2770%27%20cy%3D%2762%27%20r%3D%2726%27/%3E%3Ccircle%20cx%3D%27102%27%20cy%3D%2748%27%20r%3D%2734%27/%3E%3Ccircle%20cx%3D%27138%27%20cy%3D%2762%27%20r%3D%2725%27/%3E%3Crect%20x%3D%2758%27%20y%3D%2760%27%20width%3D%2796%27%20height%3D%2726%27%20rx%3D%2713%27/%3E%3C/g%3E%3Cg%20fill%3D%27white%27%20opacity%3D%27.75%27%3E%3Ccircle%20cx%3D%27340%27%20cy%3D%27170%27%20r%3D%2720%27/%3E%3Ccircle%20cx%3D%27366%27%20cy%3D%27158%27%20r%3D%2727%27/%3E%3Ccircle%20cx%3D%27395%27%20cy%3D%27172%27%20r%3D%2719%27/%3E%3Crect%20x%3D%27330%27%20y%3D%27170%27%20width%3D%2780%27%20height%3D%2721%27%20rx%3D%2710%27/%3E%3C/g%3E%3Cg%20fill%3D%27white%27%20opacity%3D%27.6%27%3E%3Ccircle%20cx%3D%27470%27%20cy%3D%2740%27%20r%3D%2714%27/%3E%3Ccircle%20cx%3D%27488%27%20cy%3D%2732%27%20r%3D%2719%27/%3E%3Ccircle%20cx%3D%27507%27%20cy%3D%2742%27%20r%3D%2713%27/%3E%3Crect%20x%3D%27462%27%20y%3D%2740%27%20width%3D%2754%27%20height%3D%2715%27%20rx%3D%277%27/%3E%3C/g%3E%3C/svg%3E") repeat-x 0 26px/560px 320px;animation:drift 120s linear infinite}
body::after{content:"";position:fixed;left:-10%;right:-10%;bottom:0;height:120px;z-index:-1;pointer-events:none;background:radial-gradient(55% 105px at 22% 100%,#8be07a 97%,transparent 100%),radial-gradient(55% 90px at 82% 100%,#6ad063 97%,transparent 100%)}
@keyframes drift{to{background-position:560px 26px}}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx);background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--orange)}
textarea{width:100%;height:84px;resize:vertical;font-size:13px;word-break:break-all}
h2,h3,.btn,.lv,.dtitle,.burst,.biglv,.goldbig,#tabs,#fab,.qname,.hname b,.btime,.dcount,.urgestats b,.sbox b,.rank,.pts,.cp b,.mname,.dbadge,.tree,.btop{font-family:var(--jua);font-weight:400}
h2{margin:6px 0;font-size:24px}h3{margin:0 0 10px;font-size:18px;color:#7a4b22}
.hidden{display:none!important}
.sub{color:var(--sub);font-size:13px}.gold{color:#e08a00;font-weight:700}.center{text-align:center}.mt{margin-top:8px}
#app{max-width:560px;margin:0 auto;padding:10px 12px calc(170px + env(safe-area-inset-bottom))}
.pv{background:#fff3c4;color:#8a5a00;font-size:12px;text-align:center;border-radius:12px;padding:6px;margin-bottom:8px;border:2px solid #ffd76a}

/* 상단 캐릭터 판 */
.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(180deg,#fff6df,#ffe3a8);border:3px solid var(--wood2);border-radius:22px;padding:12px 14px;margin-bottom:12px;box-shadow:0 5px 0 #a86a2f,inset 0 2px 0 #fff}
.ava{width:72px;height:72px;border-radius:50%;flex:none;position:relative;background:radial-gradient(circle at 50% 30%,#fff,#d4eeff 72%);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--aura),0 4px 10px rgba(0,0,0,.15);display:grid;place-items:center}
.ava svg{width:94%;height:94%;margin-top:2px}
svg.ci{width:100%!important;height:100%!important;margin:0!important;display:block;overflow:visible}
.ava.t4{animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 4px #fff,0 0 0 7px #ffd34d,0 0 16px 6px rgba(255,190,80,.7)}to{box-shadow:0 0 0 4px #fff,0 0 0 7px #ff9bd2,0 0 26px 10px rgba(255,150,210,.7)}}
.rbadge{position:absolute;right:-8px;bottom:-6px;font-size:15px;background:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;border:2px solid var(--wood);box-shadow:0 2px 0 var(--wood2)}
.hinfo{flex:1;min-width:0}
.hname{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.hname b{font-size:21px;color:#5a3417}.ctitle{font-size:13px;font-weight:800}
.lvrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.lv{font-size:15px;color:#fff;background:linear-gradient(180deg,#ffb84d,#ff7a00);border:2px solid #d46200;border-radius:20px;padding:1px 10px;text-shadow:0 1px 0 #b34f00;box-shadow:0 2px 0 #b34f00;white-space:nowrap}
.xpbar{flex:1;height:16px;background:#fff;border-radius:10px;overflow:hidden;border:2px solid #e0b46d}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.4) 0 6px,transparent 6px 12px),linear-gradient(180deg,#ffe46b,#ffb703);background-size:17px 17px,100% 100%;border-radius:8px;transition:width .5s;animation:stripes 1s linear infinite}
@keyframes stripes{to{background-position:17px 0,0 0}}
.xpt{font-size:11px;color:var(--sub);text-align:right;margin-top:2px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chips span{font-size:12px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:1px 9px;font-weight:700;color:#7a4b22}

/* 공통 창 */
.card{background:var(--cream);border:3px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 4px 0 #e2c391}
.card.tap{cursor:pointer}.card.tap:active{transform:translateY(2px);box-shadow:0 2px 0 #e2c391}
.jobready{background:linear-gradient(180deg,#f3e8ff,#e2ccff);border-color:#b48cff;box-shadow:0 4px 0 #9d6bff;color:#5b2bb5;font-weight:700;animation:pulse 1.1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.025)}}
.ptsnote{background:linear-gradient(180deg,#eaffdf,#d3f7c3);border-color:#9fdc84;box-shadow:0 4px 0 #7cc560;color:#2f6b1a;font-weight:700;font-size:14px}
.install{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#e8f6ff;border-color:#9fd3ff;box-shadow:0 4px 0 #74b8ef}
.dayhead{display:flex;justify-content:space-between;align-items:center}
.dtitle{font-size:20px;color:#5a3417}.stars{color:#ffb703;letter-spacing:1px;text-shadow:0 1px 0 #d08a00}
.dcount{font-size:15px;color:var(--sub)}.dcount b{font-size:32px;color:var(--orange);font-weight:400}
.pbar{height:15px;background:#fff;border:2px solid #cfe8bf;border-radius:10px;overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;background:linear-gradient(180deg,#9ff28a,#3fbf55);border-radius:8px;transition:width .4s}
.clear{margin-top:10px;background:linear-gradient(180deg,#fff6c4,#ffe27a);border:2px solid #f0b400;color:#8a5a00;border-radius:14px;padding:8px 10px;font-weight:800;font-size:14px;text-align:center}
.buffs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.buffs span{font-size:12px;background:#fff;border:2px solid #ffd6a5;color:#b35c00;border-radius:20px;padding:2px 9px;font-weight:700}

/* 퀘스트 */
.qlist{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.quest{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:11px 12px;cursor:pointer;transition:transform .1s;box-shadow:0 4px 0 #ead2a6}
.quest:active{transform:translateY(2px);box-shadow:0 2px 0 #ead2a6}
.quest:has(input):active{transform:none;box-shadow:0 4px 0 #ead2a6}
.quest.done{background:#f0ffe9;border-color:#a8e597;box-shadow:0 4px 0 #8fd27a}
.quest.done .qname{color:#3b8f2b;text-decoration:line-through;text-decoration-thickness:2px}
.qicon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:23px;background:#fff;background:color-mix(in srgb,var(--c) 20%,#fff);border:3px solid color-mix(in srgb,var(--c) 55%,#fff);flex:none}
.qbody{flex:1;min-width:0}.qname{font-size:17px;color:#4b3526}.qmeta{font-size:12px;color:var(--sub);margin-top:1px}
.dots{font-size:13px;margin-top:3px;letter-spacing:1px}
.qcheck{width:40px;height:40px;border-radius:50%;border:3px dashed #e0c79c;display:grid;place-items:center;font-weight:900;font-size:20px;flex:none;color:#fff;background:#fffdf7}
.quest.done .qcheck{background:radial-gradient(circle at 40% 35%,#9ff28a,#3fbf55);border:3px solid #2e9a42;animation:stamp .35s ease-out;box-shadow:0 2px 0 #2e9a42;text-shadow:0 1px 0 #2e7d32}
@keyframes stamp{0%{transform:scale(1.8) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.counter{display:flex;align-items:center;gap:6px;flex:none}
.counter button{width:38px;height:38px;border-radius:50%;border:2px solid #9fd3ff;background:linear-gradient(180deg,#fff,#dff1ff);font-size:22px;color:#2f7fd0;box-shadow:0 3px 0 #74b8ef;font-family:var(--jua)}
.counter button:active{transform:translateY(2px);box-shadow:0 1px 0 #74b8ef}
.counter span{min-width:40px;text-align:center;font-family:var(--jua);font-size:18px}
.numrow{display:flex;gap:6px;margin-top:7px;align-items:center;flex-wrap:wrap}
.numrow input{width:122px;padding:7px 10px}.numrow span{font-size:13px;color:var(--sub)}
.shl{font-size:12px;color:#1f6fc5;text-decoration:none;border:2px solid #a9d4ff;border-radius:12px;padding:5px 9px;background:#eef7ff;white-space:nowrap;font-weight:700}

/* 버튼 */
.btn{background:linear-gradient(180deg,#fff,#f6e7cc);border:2px solid #d9b27c;border-radius:16px;padding:10px 15px;font-size:16px;color:#6b4320;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 #c99a5f;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c99a5f}
.btn.primary{background:linear-gradient(180deg,#ffd35c,#ff9a1f);border-color:#e57a00;color:#fff;text-shadow:0 1px 0 #c25e00,0 0 2px #c25e00;box-shadow:0 4px 0 #c25e00}
.btn.primary:active{box-shadow:0 1px 0 #c25e00}
.btn.ghost{background:#fffaf0;box-shadow:0 3px 0 #e2c391}
.btn.danger{background:linear-gradient(180deg,#ffb3b3,#ff6b6b);border-color:#e04848;color:#fff;text-shadow:0 1px 0 #b83232;box-shadow:0 4px 0 #b83232}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:13px;box-shadow:0 3px 0 #c99a5f}
.btn.primary.sm{box-shadow:0 3px 0 #c25e00}
.btn.wide{width:100%;margin-top:10px}
.btn:disabled{filter:grayscale(.8);opacity:.5;cursor:default;transform:none}
.btn.glow{animation:pulse 1s ease-in-out infinite alternate}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row .btn{flex:1}
.x{background:none;border:0;color:#c9a27a;font-size:16px;padding:6px 8px}
.form{display:flex;gap:8px;flex-wrap:wrap}.form input{flex:1 1 140px}.form select{flex:1 1 110px}
.sechead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.sechead h3{margin:0}
.pts{font-size:13px;color:var(--sub);background:#fff;border-radius:20px;padding:2px 11px;border:2px solid var(--line)}
.pts.on{color:#fff;background:linear-gradient(180deg,#ffd35c,#ff9a1f);border-color:#e57a00;text-shadow:0 1px 0 #c25e00;animation:pulse 1s ease-in-out infinite alternate}

/* 궁극기·유혹 카드 */
.ult{display:flex;justify-content:space-between;align-items:center;gap:10px;border-color:var(--pc);background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--pc) 14%,#fff))}
.urgehead{display:flex;gap:12px;align-items:flex-start}.urgehead .big{font-size:32px}
.urgestats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.urgestats div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px}.urgestats b{display:block;font-size:23px;color:var(--orange)}.urgestats small{color:var(--sub);font-size:11px}

/* 캐릭터 */
.prof{text-align:center;background:linear-gradient(180deg,#d9f0ff,#fffaf0 75%);border-color:#b9e0ff;box-shadow:0 4px 0 #8cc7f5}
.prof .ava{margin:8px auto 12px;width:112px;height:112px}
.cp{font-size:13px;color:var(--sub)}.cp b{font-size:30px;color:var(--orange);display:block;text-shadow:0 2px 0 #ffd8a8}
.stat{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px dashed var(--line)}
.sicon{font-size:22px;width:42px;height:42px;border-radius:50%;background:#fff3dc;border:2px solid #ffd9a0;display:grid;place-items:center;flex:none}
.sbody{flex:1}.sbody b{font-size:15px}.sbody b em{font-style:normal;color:var(--orange);margin-left:5px;font-family:var(--jua);font-size:19px}
.sbody small{display:block;font-size:12px;color:#8a5cd6}.sbody small.flav{color:var(--sub)}
.plus{width:42px;height:42px;border-radius:50%;border:2px solid #e57a00;background:linear-gradient(180deg,#ffd35c,#ff9a1f);font-size:24px;color:#fff;font-family:var(--jua);box-shadow:0 3px 0 #c25e00;text-shadow:0 1px 0 #c25e00}
.plus:active{transform:translateY(2px);box-shadow:0 1px 0 #c25e00}
.plus:disabled{background:#eee3d0;border-color:#d8c7aa;box-shadow:0 3px 0 #cdb894;text-shadow:none;opacity:.6}
.tree{font-size:16px;color:#7a4b22;margin:16px 0 6px;padding-left:4px}
.skill{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;background:#fff;margin-top:7px;border:2px solid var(--line)}
.skill.has{border-color:#ffc56b;background:#fffaf0}.skill.locked{opacity:.55}
.skicon{font-size:22px;width:42px;height:42px;border-radius:14px;background:#eef7ff;border:2px solid #cfe7ff;display:grid;place-items:center;flex:none}
.skbody{flex:1;min-width:0}.skbody b{font-size:15px}
.skbody small{display:block;font-size:12px;color:var(--sub)}.skbody small.next{color:#2e9a42}.skbody small.req{color:#e0546a}
.rank{font-size:14px;color:var(--orange);margin-left:5px}
.curjob{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--pc);border-radius:16px;padding:10px}
.cj-ic{width:66px;height:66px;flex:none}.cj-ic svg{width:100%;height:100%}.curjob small{display:block;color:var(--sub);font-size:12px}
.plist{margin:10px 0;padding-left:20px;font-size:13px}.plist li{margin:3px 0}
.road{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.road span{font-size:12px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 8px}
.road span.got{border-color:#ffc56b;background:#fff6df;color:#b35c00;font-weight:700}.road small{color:var(--sub);margin-left:4px}
.reqbox{background:#fff;border:2px dashed #e6cfa6;border-radius:14px;padding:10px 12px;margin:10px 0}
.reqbox .req{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--sub)}.reqbox .req.ok{color:#2e9a42;font-weight:700}
.paths{display:grid;grid-template-columns:1fr;gap:10px}
.path{border:3px solid var(--pc);border-radius:18px;padding:12px;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--pc) 10%,#fff))}
.phead{display:flex;gap:10px;align-items:center}.picon{width:58px;height:58px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 30%,#fff,#e4f4ff 75%);display:grid;place-items:center}.picon svg{width:92%;height:92%}
.phead b{font-family:var(--jua);font-weight:400;font-size:19px}.phead small{display:block;color:var(--pc);font-size:12px;font-weight:800}
.pstory{font-size:13px;color:var(--sub);margin:8px 0 4px}.proad{font-size:12px;color:var(--sub)}
.path ul{margin:8px 0;padding-left:18px;font-size:13px}

/* 상점·기록·설정 */
.goldbig{font-size:36px;color:#e08a00;margin-bottom:4px;text-shadow:0 2px 0 #ffe0a3}
.rw{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:2px dashed var(--line)}.rwn{flex:1;font-weight:700}.rwp{color:#e08a00;font-family:var(--jua);font-size:17px}
.logi{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:2px dashed var(--line);font-size:13px}.logi small{color:var(--sub);flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sbox{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}.sbox b{display:block;font-size:19px;color:#7a4b22}.sbox small{font-size:11px;color:var(--sub)}
.calw{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calh{text-align:center;font-size:11px;color:var(--sub);font-weight:700}
.cal{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:11px;background:#f3e6cf;color:#a58a6e;font-weight:700}
.cal.c{background:linear-gradient(180deg,#9ff28a,#3fbf55);color:#fff}.cal.p{background:#cdf3c2;color:#3b8f2b}.cal.s{background:#bfe3ff;color:#1f6fc5}.cal.none{background:#f3e6cf}
.cal.fut,.cal.pre{background:transparent;color:#d6c2a3}.cal.today{outline:3px solid var(--orange);outline-offset:-1px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:10px}.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.legend i.c{background:#3fbf55}.legend i.p{background:#cdf3c2}.legend i.s{background:#bfe3ff}.legend i.none{background:#f3e6cf}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bk{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}.bk span{font-size:30px;display:block}.bk b{font-size:12px;display:block}.bk small{font-size:11px;color:var(--sub)}.bk.unk{opacity:.5;filter:grayscale(1)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed var(--line)}
.setrow span{flex:1}.setrow small{display:block;color:var(--sub);font-size:12px}.setrow.lock{opacity:.5}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:28px;border-radius:20px;background:#e6d5b8;position:relative;padding:0;border:0;flex:none;cursor:pointer;transition:background .2s;box-shadow:inset 0 2px 3px rgba(0,0,0,.12)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.sw:checked{background:#5ad16a}.sw:checked::after{left:25px}
.pvnote{background:#fff3c4;border-color:#ffd76a;color:#8a5a00;font-size:13px}

/* 아래 탭·전투 버튼 */
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:linear-gradient(180deg,#fffaf0,#ffefd0);border-top:3px solid var(--wood);padding:5px 4px calc(4px + env(safe-area-inset-bottom));z-index:20;border-radius:22px 22px 0 0;box-shadow:0 -3px 0 rgba(196,132,67,.25)}

#tabs .ti{font-size:21px;width:42px;height:34px;display:grid;place-items:center;border-radius:14px;transition:transform .15s}
#tabs button.on{color:#d46200}#tabs button.on .ti{background:linear-gradient(180deg,#ffe08a,#ffb84d);box-shadow:0 3px 0 #e08a00;transform:translateY(-5px)}
.badge{position:absolute;top:-2px;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:0 5px;border:2px solid #fff;font-family:-apple-system,sans-serif}
#fab{position:fixed;right:14px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:21;background:linear-gradient(180deg,#ff8f8f,#ff4d4d);color:#fff;border:3px solid #fff;border-radius:30px;padding:11px 18px;font-size:17px;box-shadow:0 5px 0 #c23434,0 8px 18px rgba(255,77,77,.35);text-shadow:0 1px 0 #b32626}
#fab:active{transform:translateY(3px);box-shadow:0 2px 0 #c23434}
#fab.on{animation:pulse .8s ease-in-out infinite alternate}

/* 유혹 전투 */
#battle{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,#5cb8ff,#bfe6ff 55%,#eaf8ff);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px)}
.bwrap{max-width:480px;margin:0 auto;text-align:center}
.btop{display:flex;justify-content:space-between;align-items:center;font-size:19px;color:#fff;text-shadow:0 2px 0 #2f7fd0}
.btop button{background:#fff;border:2px solid #9fd3ff;border-radius:14px;padding:5px 12px;color:#2f7fd0;font-family:var(--jua);box-shadow:0 3px 0 #74b8ef;text-shadow:none}
.stage{position:relative;margin:10px 0 6px;padding:8px 0 24px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.1) 64%,#8ee07a 64%,#5cc45a 100%);border:3px solid #fff;overflow:hidden;box-shadow:0 4px 0 rgba(47,127,208,.25)}
.mname{font-size:17px;color:#fff;text-shadow:0 2px 0 #c23434,0 0 3px #c23434}
.memoji{height:128px;display:grid;place-items:center;font-size:100px;animation:bob 1.8s ease-in-out infinite;transition:font-size 1s;position:relative;z-index:1}

.mshadow{width:110px;height:16px;border-radius:50%;background:rgba(0,60,0,.22);margin:-12px auto 0;position:relative}
@keyframes bob{50%{transform:translateY(-10px) scale(1.03,.97)}}
@keyframes hit{20%{transform:translateX(-10px) rotate(-8deg);filter:brightness(1.8)}50%{transform:translateX(10px) rotate(6deg)}100%{transform:none}}
.dmg{position:absolute;top:34%;font-family:var(--jua);font-size:32px;color:#ffcf3f;-webkit-text-stroke:2px #c25e00;text-shadow:0 3px 0 #8a3c00;animation:dmgUp 1s ease-out forwards;z-index:2;pointer-events:none}
@keyframes dmgUp{0%{transform:translateY(10px) scale(.6);opacity:0}25%{transform:translateY(-6px) scale(1.25);opacity:1}100%{transform:translateY(-54px) scale(1);opacity:0}}
.hpbar{height:16px;background:#fff;border:3px solid #fff;border-radius:12px;overflow:hidden;margin-top:8px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.hpbar i{display:block;height:100%;background:linear-gradient(180deg,#ff9aa2,#ff4d6d);border-radius:8px;transition:width 1s linear}
.hptext{font-size:13px;color:#c2334d;margin-top:4px;font-weight:700}
.btime{font-size:50px;margin:4px 0;color:#fff;text-shadow:0 3px 0 #2f7fd0,0 0 4px #2f7fd0;font-variant-numeric:tabular-nums}
.bmsg{min-height:44px;background:#fff;border:3px solid #ffd6a5;border-radius:18px;padding:10px 12px;font-size:14px;margin:8px 0 12px;position:relative;color:#6b4320;box-shadow:0 3px 0 #f0b97a}
.bmsg::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom-color:#ffd6a5;border-top:0}
.breath{display:flex;flex-direction:column;align-items:center;margin:10px 0}
.bring{width:130px;height:130px;display:grid;place-items:center}
.bcircle{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#a8f2e4 55%,#4fd1c5);box-shadow:0 0 0 6px rgba(255,255,255,.7),0 6px 18px rgba(79,209,197,.5);transform:scale(.6);transition:transform 1s linear}
.blabel{font-family:var(--jua);font-size:19px;margin-top:8px;color:#138a7e}
.lockhint{font-size:12px;color:var(--sub);background:rgba(255,255,255,.8);border:2px dashed #e6cfa6;border-radius:14px;padding:8px;margin:8px 0}
.subst{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 12px}
.subst button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 6px;font-size:13px;color:#6b4320;box-shadow:0 3px 0 #e2c391}
.subst button.on{background:#e6ffe0;border-color:#5ad16a;color:#2e7d32;box-shadow:0 3px 0 #3fbf55}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:14px 0}
.mpick{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 #e2c391;color:#4b3526}

.mpick span{font-size:38px;animation:bob 2.2s ease-in-out infinite}.mpick b{font-family:var(--jua);font-weight:400;font-size:16px}.mpick small{color:#e0546a;font-size:11px}
#battle h2{color:#fff;text-shadow:0 2px 0 #2f7fd0}
#battle .sub{color:#2b5f8f}
#battle .btn.ghost{background:#fff}

/* 팝업 */
#modal{position:fixed;inset:0;z-index:50;background:rgba(40,70,110,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--cream);border:4px solid var(--wood);border-radius:26px;padding:20px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;animation:pop .35s cubic-bezier(.2,1.4,.4,1);box-shadow:0 6px 0 var(--wood2),0 14px 30px rgba(0,0,0,.25);position:relative}
.mbox.fx{text-align:center;background:radial-gradient(320px 220px at 50% 0%,#fff3b8,#fffaf0 72%)}
.mbox.fx::before{content:"✦   ✧   ✦";position:absolute;top:8px;left:0;right:0;color:#ffc93c;font-size:18px;letter-spacing:14px;animation:twinkle 1.1s ease-in-out infinite alternate;pointer-events:none}
@keyframes twinkle{to{opacity:.35;transform:translateY(3px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.burst{font-size:36px;letter-spacing:1px;color:#ffcf3f;-webkit-text-stroke:2px #e07000;text-shadow:0 4px 0 #b35400;animation:bounce .9s ease-in-out infinite alternate;margin-top:6px}
@keyframes bounce{to{transform:translateY(-4px) scale(1.04)}}
.biglv{font-size:62px;color:#fff;-webkit-text-stroke:3px #ff8a1f;text-shadow:0 5px 0 #c25e00}
.tierup,.unl,.jobhint{background:#fff;border:2px dashed #ffc56b;border-radius:14px;padding:10px;margin-top:10px;font-size:13px;text-align:left}
.tierup .chg{color:#c25e00;margin-top:3px;font-weight:700}.tierup small{display:block;color:var(--sub);margin-top:6px}
.jobhint{color:#7c3aed;font-weight:700;text-align:center;border-color:#c9a7ff}
.wm,.onb-ic{font-size:76px;margin:6px 0;line-height:1.15}
.wm{animation:bob 1.8s ease-in-out infinite}
.jf-ic{width:132px;height:132px;margin:8px auto 0;border-radius:50%;background:radial-gradient(circle at 50% 30%,#fff,#d4eeff 72%);box-shadow:0 0 0 5px #fff,0 0 0 9px #ffd34d;display:grid;place-items:center;animation:bob 1.8s ease-in-out infinite}
.jf-ic svg{width:92%;height:92%}
.jobfx .plist,.onb .howl{text-align:left}
.howl div{font-size:13px;margin:7px 0;color:#5a4030;background:#fff;border-radius:12px;padding:7px 9px;border:2px solid var(--line)}
.onb input{width:100%;margin:8px 0;text-align:center}

/* 알림 */
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#fff;border:3px solid #ffd6a5;color:#6b4320;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:700;max-width:90%;box-shadow:0 4px 0 #f0b97a,0 6px 16px rgba(0,0,0,.12);animation:tin .3s cubic-bezier(.2,1.4,.4,1);transition:opacity .4s,transform .4s}
.toast.out{opacity:0;transform:translateY(-10px)}
@keyframes tin{from{transform:translateY(-14px) scale(.8);opacity:0}}
.float{position:fixed;transform:translateX(-50%);color:#ffcf3f;font-family:var(--jua);font-size:22px;-webkit-text-stroke:1.5px #c25e00;text-shadow:0 3px 0 #8a3c00;pointer-events:none;z-index:70;animation:floatUp 1.2s ease-out forwards;white-space:nowrap}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.7)}20%{transform:translate(-50%,-12px) scale(1.15)}100%{transform:translate(-50%,-64px) scale(1);opacity:0}}

/* 레이드 */
.raidmini{display:flex;gap:12px;align-items:center;background:linear-gradient(180deg,#fff2f2,#ffe0e0);border-color:#ffb3b3;box-shadow:0 4px 0 #f08a8a}
.raidmini.rage{animation:ragep .8s ease-in-out infinite alternate}.raidmini.clr{background:linear-gradient(180deg,#fff6c4,#ffe27a);border-color:#f0b400;box-shadow:0 4px 0 #d49b00}
@keyframes ragep{to{box-shadow:0 4px 0 #f08a8a,0 0 16px #ff6b6b}}
.rm-ic{font-size:40px;animation:bob 2s ease-in-out infinite}.rm-b{flex:1;min-width:0}.rm-b b{font-family:var(--jua);font-weight:400;font-size:17px}
.hpbar.sm{height:13px;margin:5px 0 3px;border-width:2px}.hpbar.big{height:22px}
.dbadge{font-size:12px;color:#fff;background:var(--dc);border-radius:20px;padding:1px 9px;vertical-align:2px;text-shadow:0 1px 0 rgba(0,0,0,.3);border:2px solid #fff;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.boss{text-align:center;border-color:#ffb3b3;box-shadow:0 4px 0 #f08a8a}
.boss.rage{border-color:#ff5b5b;box-shadow:0 4px 0 #e04848,0 0 22px rgba(255,91,91,.45)}
.boss.cleared{border-color:#f0b400;box-shadow:0 4px 0 #d49b00}
.boss .stage{background:linear-gradient(180deg,#9ed8ff 0%,#dff3ff 64%,#8ee07a 64%,#5cc45a 100%)}
.bossic{font-size:92px;line-height:1.15;margin:4px 0 0;animation:bob 2s ease-in-out infinite;position:relative;z-index:1}
.boss.cleared .bossic,.boss.failed .bossic{filter:grayscale(1);opacity:.5;animation:none}
.boss.rage .bossic,.wm.rg{animation:rage .5s ease-in-out infinite alternate}
@keyframes rage{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.08) rotate(4deg);filter:drop-shadow(0 0 10px #ff4d4d)}}
.bhead{display:flex;justify-content:space-between;align-items:center}
.weak{margin-top:10px;font-size:13px;background:#fff;border:2px dashed #ffb3b3;border-radius:14px;padding:9px;text-align:center}
.head{margin-top:10px;text-align:left}.head b{font-size:14px}.head small{color:var(--sub);font-size:11px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wkd{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 1px}.wkd small{display:block;color:var(--sub);font-size:11px}.wkd b{display:block;font-size:12px;color:var(--orange)}.wkd em{display:block;font-style:normal;color:#e0546a;font-size:11px}
.wkd.today{border-color:var(--orange);background:#fff6df}
.how{font-size:13px;padding:7px 0;border-top:2px dashed var(--line)}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.dbtn{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 #e2c391}
.dbtn b{color:var(--dc);font-family:var(--jua);font-weight:400;font-size:18px}.dbtn small{font-size:10px;color:var(--sub)}
.dbtn.on{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 12%,#fff);box-shadow:0 3px 0 var(--dc)}.dbtn:disabled{opacity:.45}
.drops{display:flex;gap:6px;margin-top:8px}.drops div{flex:1;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;font-size:11px}.drops span{display:block;font-size:26px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{background:#fff;border:3px solid var(--rc);border-radius:16px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:122px}
.slot small{font-size:10px;color:var(--sub)}.slot b{font-size:12px}.sl-ic{font-size:30px}.slot .x{font-size:11px;padding:2px 6px}
.inv{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px dashed var(--line)}.inv .ic{font-size:26px}.inv div{flex:1}.inv small{display:block;font-size:12px;color:var(--sub)}
.rar{font-size:11px;font-weight:800}
.loot{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:3px solid var(--rc);border-radius:16px;padding:10px;margin:10px 0;box-shadow:0 0 0 4px color-mix(in srgb,var(--rc) 25%,transparent);animation:lootpop .5s .2s both cubic-bezier(.2,1.5,.4,1)}
@keyframes lootpop{from{transform:scale(.4) rotate(-10deg);opacity:0}}
.loot span{font-size:42px}.loot b{display:block}.loot small{display:block;font-size:12px;color:var(--sub)}
.hist{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:7px 0;border-top:2px dashed var(--line)}
.hc{display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(180deg,#eef9ff,#dff3ff);border-color:#a9d4ff;box-shadow:0 4px 0 #8cc7f5}.hc.on{border-color:#3b9cff}.hc .btn{white-space:nowrap;flex:none}

/* v1.4 · 탭 속 구역 나누기 */
.seg{display:flex;gap:6px;background:#fff6df;border:3px solid var(--line);border-radius:18px;padding:4px;margin-bottom:12px;box-shadow:0 3px 0 #e2c391}
.seg button{flex:1;border:0;background:none;border-radius:13px;padding:8px 4px;font-family:var(--jua);font-size:15px;color:#a7876a;position:relative}
.seg button.on{background:linear-gradient(180deg,#ffe08a,#ffb84d);color:#7a3d00;box-shadow:0 3px 0 #e08a00}
.seg .badge{top:-7px;left:auto;right:4px}
.chipsel{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 2px;scrollbar-width:none}.chipsel::-webkit-scrollbar{display:none}
.chipsel button{flex:none;background:#fff;border:2px solid var(--line);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:700;color:#7a4b22;box-shadow:0 2px 0 #e2c391}
.chipsel button.on{border-color:var(--orange);background:#fff1dc;color:#c25e00}.chipsel small{color:var(--sub);font-weight:400}

/* 업적 */
.achtop{display:flex;gap:14px;align-items:center;background:linear-gradient(180deg,#fffbe8,#fff1c4);border-color:#f3d07a;box-shadow:0 4px 0 #e0b04a}
.achtop h3{margin-bottom:4px}
.achring{width:88px;height:88px;flex:none;border-radius:50%;background:conic-gradient(#ffb703 calc(var(--p)*1%),#f3e3c4 0);display:grid;place-items:center;box-shadow:0 3px 0 #e0b04a}
.achring div{width:68px;height:68px;border-radius:50%;background:#fffaf0;display:flex;align-items:baseline;justify-content:center;padding-top:18px}
.achring b{font-family:var(--jua);font-weight:400;font-size:28px;color:#e07a00;line-height:1}.achring small{font-size:12px;color:var(--sub)}
.ttlnow{font-size:13px;margin-top:6px}
.ttl{display:inline-block;font-size:11px;font-weight:800;color:#8a4b00;background:linear-gradient(180deg,#fff4c2,#ffd66b);border:2px solid #e0a419;border-radius:20px;padding:0 8px;line-height:1.6;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.hinfo .ttl{margin-bottom:3px}
.near{background:linear-gradient(180deg,#f2fbff,#e3f4ff);border-color:#b9e0ff;box-shadow:0 4px 0 #8cc7f5}
.ach{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:2px dashed var(--line)}
h3+.ach{border-top:0;padding-top:2px}
.aic{font-size:24px;width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:#f1ebe1;filter:grayscale(1);opacity:.55}
.ach.got .aic{filter:none;opacity:1;background:radial-gradient(circle at 50% 35%,#fff9df,#ffd66b);box-shadow:0 0 0 2px #f0b400,0 2px 0 3px #e0a419}
.abody{flex:1;min-width:0}.abody b{font-size:15px}.abody small{display:block;color:var(--sub);font-size:12px}.abody small .gold{font-weight:800}
.abody .adate{color:#2e9a42;font-weight:700}
.abar{height:8px;background:#f1e4cc;border-radius:6px;overflow:hidden;margin:5px 0 2px}.abar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf3f,#ff9a1f);border-radius:6px}
.ach .btn{flex:none}

/* 도감 */
.bbook{display:flex;flex-direction:column;gap:8px}
.bb{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 10px}
.bbart{width:92px;flex:none;background:linear-gradient(180deg,#bfe6ff 0%,#e8f6ff 64%,#a6e891 64%);border-radius:14px;padding:2px}
.bbart svg{width:100%;height:auto;display:block}
.bb.unk .bbart svg{filter:brightness(0);opacity:.18}
.bb:not(.kill):not(.unk) .bbart svg{filter:saturate(.55)}
.bb.kill{border-color:#ffd36b;background:linear-gradient(180deg,#fffdf4,#fff3cf)}
.bb b{font-family:var(--jua);font-weight:400;font-size:17px;display:block}.bb small{display:block;font-size:12px;margin-top:1px}
.cosmini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cm{text-align:center;cursor:pointer}.cmi{background:radial-gradient(circle at 50% 30%,#fff,#e3f2ff 72%);border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--line);aspect-ratio:1;display:grid;place-items:center}.cmi svg{width:92%;height:auto;display:block}

.cm.unk .cmi svg{filter:brightness(0);opacity:.16}

/* 코스튬 상점 */
.cosh{display:flex;gap:14px;align-items:center;background:linear-gradient(180deg,#fff0f7,#ffe0ef);border-color:#ffc1dc;box-shadow:0 4px 0 #f19ac2}
.cosh .ava{width:86px;height:86px}.cosh .goldbig{font-size:24px}
.cosgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.cos{position:relative;background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 4px 0 #e2c391}
.cos.on{border-color:var(--orange);box-shadow:0 4px 0 #e08a00,0 0 0 3px #ffe0b0}
.cpv{width:98px;height:98px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#fff,color-mix(in srgb,var(--rc) 20%,#eaf6ff) 72%);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--rc);display:grid;place-items:center;margin:6px 0 8px;cursor:pointer}
.cpv svg{width:92%;height:92%;margin-top:2px}
.cpv.big{width:150px;height:150px;margin:6px auto 10px;animation:bob 2s ease-in-out infinite}
.cos b{font-family:var(--jua);font-weight:400;font-size:16px;line-height:1.25}
.cos small{font-size:11px}.cos .rr{font-weight:800}.cdesc{color:var(--sub);line-height:1.35;flex:1}
.cos .btn{margin-top:6px;width:100%}
.newb{position:absolute;top:6px;right:6px;background:#ff3b5c;color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 6px;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.15);animation:pulse .9s ease-in-out infinite alternate;z-index:1}
.newb.in{position:static;display:inline-block;animation:none;vertical-align:1px}

/* 보스 그림 */
.bossic{width:230px;max-width:78%;margin:4px auto 0;animation:bob 2s ease-in-out infinite;position:relative;z-index:1}
.bossic svg,.rm-ic svg,.wm.art svg{width:100%;height:auto;display:block}

function merge(def,obj){
 if(obj==null||typeof obj!=='object'||Array.isArray(obj))return def;
 const out={...def};
 for(const k in obj){const d=def[k],o=obj[k];
  if(d&&typeof d==='object'&&!Array.isArray(d)&&o&&typeof o==='object'&&!Array.isArray(o))out[k]=merge(d,o);
  else out[k]=o;}
 return out}

const sk=id=>S.skills[id]||0;
function clsP(){const c=S.cls;return(c.path&&c.tier)?PATHS[c.path].passive(c.tier):{}}

const goldMult=()=>1+sk('goldhand')*0.15+gearB('gold');
const critChance=()=>Math.min(0.5,S.stats.luk*0.01+sk('lucky')*0.03+gearB('crit'));
function questMult(cat){
 const st=CATS[cat].stat,p=clsP();
 let m=1+S.stats[st]*STATS[st].per/100+generalBonus()+(p[cat]||0)+gearB(cat==='endure'?'endure':cat==='body'?'body':'mindlife');
 if(cat==='mind'||cat==='life')m+=(p.mindlife||0);
 if(ultOn()){const u=S.cls.path;if(u==='warrior'&&cat==='body')m*=3;if(u==='sage'&&(cat==='mind'||cat==='life'))m*=3}
 return m}
const questBase=q=>q.custom?CAT_BASE[q.cat]:Math.round(CAT_BASE[q.cat]*(1+0.1*S.today.tier));

function rollover(){
 const tk=todayKey(),msgs=[];
 if(!S.today){S.today=newDay(tk);ensureRaid();return msgs}
 if(tk<=S.today.date){ensureRaid();return msgs}
 const d0=S.today,cleared=d0.quests.length>0&&d0.quests.every(q=>q.done);

 S.history[d0.date]=rec;petBank(d0);

 else missDay(d0.date,msgs,rec);

 while(d<tk&&n<400){missDay(d,msgs);d=addDays(d,1);n++}
 S.today=newDay(tk);
 const keys=Object.keys(S.history).sort();if(keys.length>420)keys.slice(0,keys.length-420).forEach(k=>delete S.history[k]);
 ensureRaid();return msgs}

const findQ=id=>S.today.quests.find(q=>q.id===id);
function complete(q,el){
 let xp=questBase(q)*questMult(q.cat);const crit=Math.random()<critChance();if(crit)xp*=2;xp=Math.round(xp);
 const gold=Math.round((5+S.today.tier)*goldMult());
 q.done=true;q.xp=xp;q.gold=gold;addGold(gold);S.totals.quests++;if(!q.custom)S.qCount[q.id]=(S.qCount[q.id]||0)+1;
 const hit=raidHit(xp,{kind:'quest',q});q.map=hit?hit.map:null;q.dmg=hit?hit.dmg:0;
 floatText(el,`+${xp} XP${crit?' 크리티컬!':''}${hit?(hit.dmg?` ⚔️${hit.dmg}${hit.weak?' 약점!':''}`:' (잘린 머리)'):''}`);vib(25);gainXP(xp);recheckClear()}

 raidUnhit(q.map);q.map=null;q.dmg=0;if(q.smap){raidUnhit(q.smap);q.smap=null;q.sdmg=0}if(!skip)recheckClear()}
function setInputDone(q,ok,el){if(ok&&!q.done)complete(q,el);else if(!ok&&q.done)uncomplete(q)}
function applySteps(q){if((q.val||0)>S.best.steps)S.best.steps=q.val;const extra=Math.max(0,Math.min(q.val||0,q.target+5000)-q.target);const want=q.done?Math.floor(extra/1000)*Math.round(5*(1+.1*S.today.tier)):0;
 if(q.smap){raidUnhit(q.smap);q.smap=null;q.sdmg=0}
 if(want>0){const r=raidHit(want,{kind:'steps'});if(r&&r.dmg){q.smap=r.map;q.sdmg=r.dmg;toast(`🚶 초과 걸음 보너스! 보스에게 ⚔️${r.dmg}`)}}}

 if(all&&!d.bonus){const b=bonusCalc();d.bonus=b.xp;d.bonusGold=b.gold;addGold(b.gold);S.totals.clears++;gainXP(b.xp);addLog('🏆',`올클리어! +${b.xp} XP`);vib([40,60,40]);

 else if(!all&&d.bonus){loseXP(d.bonus);subGold(d.bonusGold);S.totals.clears=Math.max(0,S.totals.clears-1);d.bonus=0;d.bonusGold=0;raidUnhit(d.bmap);d.bmap=null}}

 if(S.cls.path==='paladin')S.shields++;else S.ultDay=S.today.date;
 addLog('💥',`궁극기 「${p.ult.name}」 발동`);vib([80,40,80]);
 showModal(`<div class="wm">💥</div><div class="burst">${p.ult.name}!</div><p>${p.ult.desc}</p><p class="sub">${S.cls.path==='paladin'?'보호막이 하루 실패를 막아 줘요.':'지금부터 완료하는 것에 적용돼요. 오늘을 불태우세요!'}</p><button class="btn primary wide" data-act="close">간다!</button>`,{cls:'fx'});commit()}

let btimer=null,lastMsg=-1;
function battleMsgs(){const m=MSGS.slice();if(S.totals.urgeWins>0)m.splice(2,0,`지금까지 ${S.totals.urgeWins}번 이겼어요. 이번에도 이길 수 있어요.`);return m}
function openBattle(){if(S.battle){showBattle();return}

 <div class="mgrid">${Object.entries(MONS).map(([k,m])=>`<button class="mpick" data-act="battle-start" data-arg="${k}"><span>${m.icon}</span><b>${m.label}</b><small>${m.name}</small></button>`).join('')}</div>
 <p class="sub">승리 보상 약 +${Math.round(BATTLE_XP[S.battleMin]*urgeMult())} XP · 지더라도 잃는 건 없어요</p></div>`;

function battleHTML(){const b=S.battle,m=MONS[b.mon];
 const breath=sk('breath')?`<div class="breath"><div class="bring"><div class="bcircle" id="bc"></div></div><div class="blabel" id="bl">들이쉬기</div></div>`:`<div class="lockhint">🔒 스킬 「심호흡」을 배우면 호흡 가이드가 열려요</div>`;
 const subst=sk('subst')?`<div class="sub">대체 행동 하나를 해 보세요 (승리 XP +15)</div><div class="subst">${SUBST.map((s,i)=>`<button class="${b.si===i?'on':''}" data-act="subst" data-arg="${i}">${s}</button>`).join('')}</div>`:`<div class="lockhint">🔒 스킬 「대체 행동」을 배우면 행동 카드가 열려요</div>`;
 return `<div class="bwrap"><div class="btop"><span>⚔️ 유혹 전투</span><button data-act="battle-min">접어두기</button></div>
 <div class="stage"><div class="mname">Lv.${S.level} ${m.name}</div><div class="memoji" id="bm">${m.icon}</div><div class="mshadow"></div></div>
 <div class="hpbar"><i id="bhp" style="width:100%"></i></div><div class="hptext" id="bhpt"></div>
 <div class="btime" id="btime">--:--</div><div class="bmsg" id="bmsg"></div>${breath}${subst}

function popDmg(t){const st=document.querySelector('#battle .stage');if(!st)return;const d=document.createElement('div');d.className='dmg';d.textContent=t;d.style.left=(38+Math.random()*18)+'%';st.appendChild(d);setTimeout(()=>d.remove(),1000)}
function showBattle(){$('#battle').innerHTML=battleHTML();$('#battle').classList.remove('hidden');$('#fab').classList.add('hidden');clearInterval(btimer);btimer=setInterval(battleTick,1000);lastMsg=-1;battleTick()}
function hideBattle(){clearInterval(btimer);btimer=null;$('#battle').classList.add('hidden');$('#battle').innerHTML='';render()}
function battleTick(){const b=S.battle;if(!b)return;
 const total=b.min*60,el=Math.max(0,Math.floor((Date.now()-b.start)/1000)),rem=total-el;
 if(rem<=0){winBattle();return}
 const hp=$('#bhp');if(!hp)return;
 hp.style.width=(rem/total*100)+'%';$('#bhpt').textContent=`HP ${rem} / ${total}`;
 $('#btime').textContent=`${Math.floor(rem/60)}:${pad(rem%60)}`;
 const m=$('#bm');m.style.fontSize=(60+40*rem/total)+'px';
 const mi=Math.floor(el/15);if(mi!==lastMsg){lastMsg=mi;const ms=battleMsgs();$('#bmsg').textContent=ms[mi%ms.length];if(el>0){m.classList.remove('hit');void m.offsetWidth;m.classList.add('hit');popDmg('-15')}}
 const bc=$('#bc');if(bc){const ph=el%14;let s,l,c;
  if(ph<4){s=.55+.45*(ph+1)/4;l='들이쉬기';c=4-ph}else if(ph<8){s=1;l='멈추기';c=8-ph}else{s=1-.45*(ph-7)/6;l='내쉬기';c=14-ph}
  bc.style.transform=`scale(${s})`;$('#bl').textContent=`${l} ${c}`}}
function winBattle(){const b=S.battle;if(!b)return;S.battle=null;const m=MONS[b.mon]||MONS.etc;
 const over=S.today.urgeWins>=5;let xp=(BATTLE_XP[b.min]||35)*urgeMult();if(over)xp*=.5;
 const crit=Math.random()<critChance();if(crit)xp*=2;xp=Math.round(xp)+(b.subst?15:0);
 const gold=Math.round(10*goldMult()*(1+sk('hunter')*.1)*(ultOn()&&S.cls.path==='monk'?3:1)*(over?.5:1));
 S.today.urgeWins++;S.totals.urgeWins++;recUrge(b.mon,b.start,1);S.best.urgeDay=Math.max(S.best.urgeDay||0,S.today.urgeWins);S.book[b.mon]=(S.book[b.mon]||0)+1;addGold(gold);
 let iron=false;if(sk('ironwall')&&S.today.urgeWins===3){S.buffDay=addDays(S.today.date,1);iron=true}
 const hit=raidHit(xp,{kind:'urge',mon:b.mon});
 addLog('⚔️',`${m.name} 격퇴 +${xp} XP`);vib([50,50,120]);
 clearInterval(btimer);btimer=null;$('#battle').classList.add('hidden');$('#battle').innerHTML='';
 showModal(`<div class="wm">${m.icon}</div><div class="burst">VICTORY!</div><h2>${m.name} 격퇴!</h2><p>+${xp} XP${crit?' (크리티컬!)':''} · +${gold}G</p>${hit&&hit.dmg?`<p class="gold">⚔️ ${BOSSES[S.raid.boss].name}에게 ${fmt(hit.dmg)} 피해${hit.weak?' (약점 2배!)':''}</p>`:''}${b.subst?'<p class="sub">대체 행동 보너스 +15 XP 포함</p>':''}${over?'<p class="sub">하루 6번째 전투부터는 보상이 절반이에요</p>':''}${iron?'<p class="gold">🧱 철벽 발동! 내일 모든 XP +20%</p>':''}<p class="sub">오늘 ${S.today.urgeWins}회 · 누적 ${S.totals.urgeWins}회 격퇴</p><button class="btn primary wide" data-act="close">해냈다!</button>`,{cls:'fx'});
 gainXP(xp);commit()}
function loseBattle(){if(!S.battle)return;const m=MONS[S.battle.mon]||MONS.etc,bm=S.battle.mon,now=Date.now();recUrge(bm,S.battle.start,0);
 const df=S.def&&!S.def.res&&S.def.m===bm&&now>=S.def.from-1800e3&&now<S.def.to;if(df){S.def.res='fail';addLog('🌧️',`방어 실패: ${m.name} (${USLOT[S.def.s][2]})`)}
 S.battle=null;S.totals.urgeLosses++;addLog('🏳️',`${m.name}에게 패배`);
 const heal=(raidOn()&&S.raid.diff==='hell')?raidHeal(.05,S.today.date):0;
 clearInterval(btimer);btimer=null;$('#battle').classList.add('hidden');$('#battle').innerHTML='';
 showModal(`<div class="wm">🌧️</div><h2>괜찮아요</h2><p>한 번 졌다고 모험이 끝나지 않아요. 잃은 경험치도 없어요.</p>${heal?`<p class="sub">☠️ 헬 난이도라 보스가 HP를 ${fmt(heal)} 회복했어요.</p>`:''}${df?'<p class="sub">🛡️ 이번 방어전은 놓쳤어요. 다음 위험 시간에 다시 도전해요.</p>':''}<p class="sub">다음에 같은 유혹이 오면 물 한 잔 마시고, 자리에서 일어난 다음 전투를 시작해 보세요.</p><button class="btn primary wide" data-act="close">다시 일어선다</button>`,{cls:'fx'});commit()}

const mq=[];let modalOpen=false,pendingCf=null;
function showModal(html,o){mq.push({html,o:o||{}});if(!modalOpen)nextModal()}
function nextModal(){const m=mq.shift();const el=$('#modal');if(!m){modalOpen=false;el.classList.add('hidden');el.innerHTML='';return}
 modalOpen=true;el.innerHTML=`<div class="mbox ${m.o.cls||''}">${m.html}</div>`;el.classList.remove('hidden')}
function confirmBox(msg,fn){pendingCf=fn;showModal(`<p style="font-size:16px">${msg}</p><div class="row"><button class="btn ghost" data-act="close">취소</button><button class="btn primary" data-act="cf-yes">확인</button></div>`)}
function toast(msg){const box=$('#toasts');while(box.children.length>=3)box.firstChild.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;box.appendChild(el);setTimeout(()=>el.classList.add('out'),2400);setTimeout(()=>el.remove(),2900)}
function floatText(el,text){if(!el)return;const r=el.getBoundingClientRect();const f=document.createElement('div');f.className='float';f.textContent=text;f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top+4)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1300)}
function vib(p){try{if(inApp){HB.vibrate(Array.isArray(p)?p.filter((_,i)=>i%2===0).reduce((a,b)=>a+b,0):p);return}navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

const codeOK=c=>{c=normCode(c);return c.length===16&&[...c].every(ch=>CODE_CH.includes(ch))};
function newCode(){const a=new Uint8Array(16);crypto.getRandomValues(a);return fmtCode([...a].map(x=>CODE_CH[x&31]).join(''))}
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};

async function sha(s){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))}
async function cloudKeys(code){const c=normCode(code);return{id:hex(await sha('hrpg-backup-id:'+c)),key:await crypto.subtle.importKey('raw',await sha('hrpg-backup-key:'+c),'AES-GCM',false,['encrypt','decrypt'])}}

async function sealState(code){const{id,key}=await cloudKeys(code);let raw=new TextEncoder().encode(JSON.stringify(S)),z=0;

function raidOn(){return !!(S.raid&&S.raid.status==='active'&&BOSSES[S.raid.boss])}
function getItem(uid){return uid?S.inv.find(i=>i.uid===uid)||null:null}
function itemVal(it){return Math.round(ITEMS[it.key].v*RAR[it.r].m*(1+.2*it.plus)*10)/10}
function gearB(fx){let t=0;if(!S||!S.gear)return 0;for(const uid of Object.values(S.gear)){const it=getItem(uid);if(it&&ITEMS[it.key]&&ITEMS[it.key].fx===fx)t+=itemVal(it)/100}return t}
function fxText(it){const d=ITEMS[it.key],v=itemVal(it);return `${EFX[d.fx]} ${d.fx==='heal'?'-':'+'}${v}${d.fx==='crit'?'%p':'%'}`}

function estParts(){const p={endure:0,body:0,mindlife:0};
 for(const q of S.today.quests){const v=questBase(q)*questMult(q.cat);p[q.cat==='endure'?'endure':q.cat==='body'?'body':'mindlife']+=v}
 p.endure+=BATTLE_XP[S.battleMin]*urgeMult();const b=bonusCalc().xp*1.5/3;p.endure+=b;p.body+=b;p.mindlife+=b;p.total=p.endure+p.body+p.mindlife;return p}
function setRaidHp(R){const e=estParts(),left=7-dayIdx(S.today.date);const total=Math.max(60*left,Math.round(e.total*DIFF[R.diff].f*left/7/10)*10);
 if(R.boss==='hydra'){R.heads={};R.headMax={};for(const g of Object.keys(HEADS)){const v=Math.round(total*e[g]/e.total);R.heads[g]=v;R.headMax[g]=v}R.maxHp=Object.values(R.headMax).reduce((a,b)=>a+b,0)}

const C={
 tpl:el=>{if(dayCheck())return;toggleTpl(el.dataset.arg,el.checked);commit()},
 daystart:el=>{S.dayStart=+el.value;const m=rollover();commit();m.forEach(x=>toast(x))},
 bmin:el=>{S.battleMin=+el.value;commit()},
 bkfile:el=>{const f=el.files&&el.files[0];if(!f)return;f.text().then(t=>confirmBox('지금 기록을 백업 파일 내용으로 덮어쓸까요?',()=>restoreFrom(t)))}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=H[el.dataset.act];if(f){e.preventDefault();f(el.dataset.arg,el,e)}});
document.addEventListener('change',e=>{const el=e.target,f=el.dataset&&C[el.dataset.chg];if(f)f(el)});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key!=='Enter')return;if(t.id==='onbName')H['onb-done']();else if(t.id&&t.id.startsWith('in_')){const q=findQ(t.id.slice(3));if(q){e.preventDefault();H[q.type==='sleep'?'q-sleep':'q-num'](q.id,t)}}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;render()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('설치 완료! 홈 화면에서 실행하세요');render()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){dayCheck();cloudAuto();verCheck(false);if(inApp)syncHealth(false);if(S.battle&&!$('#battle').classList.contains('hidden'))battleTick();else if(S.battle)render()}});
setInterval(()=>{dayCheck();cloudAuto();if(S.battle&&$('#battle').classList.contains('hidden')&&Date.now()-S.battle.start>=S.battle.min*60e3)showBattle()},5000);

/* ---------- 시작 ---------- */
(function init(){
 S=merge(defaults(),load());if(!S.created)S.created=todayKey();
 migrateToday();migrate14();migrate15();migrate16();migrate17();
 const msgs=rollover();defSync();checkAch(true);save();snapTake();render();cosNotify();
 setTimeout(()=>verCheck(false),3000);
 setTimeout(()=>{if(S.cloud.on)cloudAuto();else cloudPing().then(r=>{if(r&&cloudAskOn()&&tab==='quest'&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))render()})},2000);
 if(S.battle)showBattle();
 if(!S.onboarded)howto(true);
 flushRaid();petWelcome();
 msgs.forEach(m=>toast(m));
 if(inApp)setTimeout(()=>syncHealth(false),700);
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 try{if('serviceWorker' in navigator&&!inFrame&&(location.protocol==='https:'||location.hostname==='localhost')){
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;save();location.reload()}});
  navigator.serviceWorker.register('sw.js').catch(()=>{})}}catch(e){}
})();
</script>
</body>
